  <link rel="manifest" href="/quiet-signal/manifest.webmanifest" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />

  <style>
    html, body { margin: 0; height: 100%; background: #05060c; overflow: hidden; overscroll-behavior: none; }
    body { touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
    /* the game sits inside the safe area: never under the notch, the rounded corners or the home bar */
    #game { position: fixed; top: env(safe-area-inset-top); right: env(safe-area-inset-right); bottom: env(safe-area-inset-bottom); left: env(safe-area-inset-left); }
    canvas { display: block; image-rendering: pixelated; }
    /* the game is played sideways: on a phone held upright, ask to turn it */
    #rotate { display: none; position: fixed; inset: 0; z-index: 10; background: #05060c; color: #ffe9a8; font: 14px/2 "Press Start 2P", monospace;
      align-items: center; justify-content: center; text-align: center; padding: 24px; box-sizing: border-box; }
    #rotate b { display: block; font-size: 40px; margin-bottom: 18px; animation: tilt 2.4s ease-in-out infinite; }
    @keyframes tilt { 0%, 30% { transform: rotate(0); } 60%, 100% { transform: rotate(-90deg); } }
    @media (orientation: portrait) and (pointer: coarse) { #rotate { display: flex; } }
    /* full screen on / off: a small pixel button in the top-left corner, over the game */
    #fs { position: fixed; z-index: 5; top: calc(env(safe-area-inset-top) + 10px); left: calc(env(safe-area-inset-left) + 10px);
      width: 44px; height: 44px; padding: 8px; border: 0; background: #0b0a12b0; color: #c9d0e8; opacity: 0.55; cursor: pointer;
      image-rendering: pixelated; touch-action: manipulation; }
    #fs:hover, #fs:active { opacity: 1; }
    #fs svg { width: 100%; height: 100%; display: block; }
    #fs .out { display: none; }
    :fullscreen #fs .in, :-webkit-full-screen #fs .in { display: none; }
    :fullscreen #fs .out, :-webkit-full-screen #fs .out { display: block; }
  </style>
  <script type="module" crossorigin src="/quiet-signal/assets/main-Belyk07N.js"></script>
  <link rel="modulepreload" crossorigin href="/quiet-signal/assets/preload-helper-DSOBnQCC.js">
</head>

  <div id="game"></div>

    <path class="out" d="M2 0h1v3H0V2h2zM5 0h1v2h2v1H5zM0 5h3v3H2V6H0zM5 5h3v1H6v2H5z"/></svg></button>

</body>
